lang: en-GB
# Site Settings
remote_theme: chrisrhymes/bulma-clean-theme
title: LearnTech Foundation
asset_version: "20261111-business-presets-seo-2"
tagline: Practical software. Useful technology.
social:
  name: LearnTech Foundation
email: bertlandhope@gmail.com
description: >
  LearnTech Foundation builds practical software and provides technology services from Kingston, Jamaica.
baseurl: ""
url: "https://learntechfoundation.org"
permalink: pretty
favicon: /favicon.png
#gh_sponsor: chrisrhymes
#hide_share_buttons: true
#theme_color: '#eeeeee'
#fixed_navbar: top

twitter_username: BertlandHope
github_username:  bertlandh
image: /favicon.png

paginate: 6
paginate_path: "/news/page:num"

# Disqus Comments
disqus:
  # Leave shortname blank to disable comments site-wide.
  # Disable comments for any post by adding `comments: false` to that post's YAML Front Matter.
  # shortname: my_disqus_shortname
  shortname: 


plugins:
  - github-pages
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - kramdown-parser-gfm

exclude: 
  - Gemfile
  - clean-theme.gemspec
  - Gemfile.lock
  - node_modules
  - scripts
  - tests
  - BUSINESS-TOOLS.md
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

livereload: true

sass:
  style: compressed
  source_dir: _sass

google_analytics: ""
analytics:
  enabled: true
  measurement_id: "G-JJ6E4L6716"

defaults:
  - scope:
      path: "tools"
    values:
      social_image_only: true
      image:
        path: /assets/images/social/free-business-tools-share-v1.jpg
        width: 1200
        height: 630
        alt: "LearnTech Foundation — Free tools. Less busywork. Create invoices, brand photos and check your website. Try the free tools."
  -
    scope:
      path: ""
      type: "pages"
    values:
      show_sidebar: true
  -
    scope:
      path: ""
      type: "posts"
    values:
      author: "Bertland Hope"
      layout: post
      image: https://via.placeholder.com/1200x800
      show_sidebar: true

  - scope:
      path: "googleb8c0a50292fd05ec.html"
    values:
      sitemap: false

markdown: kramdown
highlighter: rouge

footer_menu: footer_menu

collections:
  products: 
    output: true
    layout: product
    image: https://via.placeholder.com/800x600
    show_sidebar: false

# SEO
author: 
  twitter: bertlandhope
logo: /img/learntech-signature-wordmark.png
twitter:
  username: bertlandhope
  card: summary_large_image
facebook:
  publisher: https://www.facebook.com/bertlandh
  name: Bertland Hope
  links:
    - https://www.twitter.com/bertlandhope
    - https://www.facebook.com/bertlandh
    - https://github.com/bertlandh
