{% if page.tool_id %}{% assign tool = site.data.business_tools[page.tool_id] %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","@id":{{ page.url | absolute_url | append: '#application' | jsonify }},"name":{{ tool.name | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"description":{{ page.description | jsonify }},"applicationCategory":{{ tool.category | jsonify }},"operatingSystem":"Any","browserRequirements":"Requires JavaScript and a modern web browser","inLanguage":"en","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"image":{{ page.image.path | absolute_url | jsonify }},"creator":{"@type":"Organization","@id":{{ '/#organization' | absolute_url | jsonify }},"name":"LearnTech Foundation","url":{{ '/' | absolute_url | jsonify }}},"featureList":{{ tool.steps | jsonify }}}</script>
{% elsif page.tools_hub %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"CollectionPage","@id":{{ page.url | absolute_url | append: '#tools' | jsonify }},"name":{{ page.title | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"description":{{ page.description | jsonify }},"mainEntity":{"@type":"ItemList","itemListElement":[{% for entry in site.data.business_tools %}{% assign tool = entry[1] %}{"@type":"ListItem","position":{{ forloop.index }},"name":{{ tool.name | jsonify }},"url":{{ tool.url | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}}</script>{% endif %}
