<figure class="device-showcase{% unless include.mobile %} device-showcase--desktop{% endunless %}">
  <div class="device-showcase__stage">
    <div class="device-monitor">
      <div class="device-monitor__screen"><img src="{{ include.desktop | relative_url }}" alt="{{ include.desktop_alt | escape }}" width="1440" height="{{ include.desktop_height | default: 810 }}" {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}></div>
      <div class="device-monitor__chin" aria-hidden="true"><span></span></div>
      <div class="device-monitor__stand" aria-hidden="true"></div>
    </div>
    {% if include.mobile %}<div class="device-phone"><div class="device-phone__screen"><img src="{{ include.mobile | relative_url }}" alt="{{ include.mobile_alt | escape }}" width="360" height="864" {% if include.priority %}fetchpriority="high"{% else %}loading="lazy"{% endif %}></div><span class="device-phone__speaker" aria-hidden="true"></span></div>{% endif %}
  </div>
  <figcaption>{{ include.caption }}</figcaption>
</figure>
