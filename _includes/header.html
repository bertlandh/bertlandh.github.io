<header class="site-header" data-site-header>
    <div class="site-container site-header__inner">
        <a href="{{ '/' | relative_url }}" class="site-brand" aria-label="{{ site.title }} home">
            <span class="site-brand__name">{{ site.title }}</span>
            <span class="site-brand__tagline">{{ site.tagline }}</span>
        </a>
        <button class="site-nav__toggle" type="button" aria-controls="site-navigation" aria-expanded="false" data-nav-toggle>
            <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
            <span class="is-sr-only">Toggle navigation</span>
        </button>
        <nav class="site-nav" id="site-navigation" aria-label="Primary navigation" data-site-nav>
            <ul class="site-nav__list">
                <li><a href="{{ '/' | relative_url }}" class="site-nav__link {% if page.url == '/' %}is-active{% endif %}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a></li>
                {% for item in site.data.navigation %}
                    <li class="site-nav__item {% if item.dropdown %}site-nav__item--dropdown{% endif %}">
                        <a href="{{ item.link | relative_url }}" class="site-nav__link {% if item.link == page.url %}is-active{% endif %}" {% if item.link == page.url %}aria-current="page"{% endif %}>{{ item.name }}{% if item.dropdown %} <span aria-hidden="true">⌄</span>{% endif %}</a>
                        {% if item.dropdown %}
                            <div class="site-nav__dropdown">
                                {% for subitem in item.dropdown %}<a href="{{ subitem.link | relative_url }}" class="site-nav__dropdown-link {% if subitem.link == page.url %}is-active{% endif %}">{{ subitem.name }}</a>{% endfor %}
                            </div>
                        {% endif %}
                    </li>
                {% endfor %}
            </ul>
            <a href="{{ '/connect/' | relative_url }}" class="site-button site-button--primary site-nav__cta">Discuss a project</a>
        </nav>
    </div>
</header>
