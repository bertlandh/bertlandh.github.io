{% assign person = include.person %}<article class="person-card">{% if person.image %}<img class="person-photo" src="{{ person.image | relative_url }}" alt="{{ person.image_alt | escape }}" width="160" height="160" decoding="async">{% else %}<div class="person-initials" aria-hidden="true">{{ person.initials }}</div>{% endif %}<p class="eyebrow">{{ person.role | escape }}</p><h2>{{ person.name | escape }}</h2><p>{{ person.summary | escape }}</p><a class="phone-link" href="tel:+{{ person.phone | escape }}">{{ person.display | escape }}</a><div class="actions"><a class="button" href="{{ site.data.pet_business.base_path | append: '/' | append: person.slug | append: '/' | relative_url }}">Open contact card</a><a class="text-link" href="{{ site.data.pet_business.base_path | append: '/contacts/' | append: person.slug | append: '.vcf' | relative_url }}" download>Save contact</a></div></article>
