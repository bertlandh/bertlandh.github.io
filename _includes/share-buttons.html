{% capture share_url %}{{ site.url }}{{ page.url | relative_url }}{% endcapture %}
<div class="article-share" aria-labelledby="share-title">
  <p id="share-title"><strong>Share this article</strong></p>
  <div class="article-share__links">
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
    <a href="https://twitter.com/intent/tweet?url={{ share_url | url_encode }}&amp;text={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on X / Twitter"><i class="fab fa-twitter" aria-hidden="true"></i></a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
    <a href="https://reddit.com/submit?url={{ share_url | url_encode }}&amp;title={{ page.title | url_encode }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Reddit"><i class="fab fa-reddit-alien" aria-hidden="true"></i></a>
  </div>
</div>
